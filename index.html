<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubonpan Multiplayer Bingo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 27, 75, 0.88)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glow-text {
            text-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- FLOATING VOLUME CONTROL -->
    <div class="fixed top-4 right-4 glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 z-50 shadow-2xl">
        <span class="text-lg">🔊</span>
        <div class="flex flex-col">
            <span class="text-[10px] text-slate-400 font-medium">ระดับเสียง</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.4" class="w-24 accent-indigo-500 cursor-pointer" oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
    <audio id="sfx-draw" src="draw.mp3" preload="auto"></audio>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="glass-panel p-8 rounded-3xl w-full max-w-md">
        <h1 class="text-3xl font-extrabold text-center mb-6 text-indigo-400 glow-text">🎯 UBONPAN BINGO</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">ชื่อผู้เล่น / เจ้ามือ:</label>
                <input type="text" id="player-name" placeholder="กรอกชื่อของคุณ..." class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">เลือกบทบาท:</label>
                <select id="role-select" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition" onchange="toggleRoleOptions()">
                    <option value="player">ผู้เล่นทั่วไป (Player)</option>
                    <option value="host_player">เจ้ามือสุ่มเลข + ร่วมเล่นด้วย (Host & Player)</option>
                    <option value="host_only">เจ้ามือควบคุมอย่างเดียว (Host Only)</option>
                </select>
            </div>
            <div id="card-count-container">
                <label class="block text-sm font-medium mb-1 text-slate-300">จำนวนใบ Bingo (1-3 ใบ):</label>
                <select id="card-count" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition" onchange="renderCardSeedInputs()">
                    <option value="1">1 ใบ</option>
                    <option value="2">2 ใบ</option>
                    <option value="3">3 ใบ</option>
                </select>
            </div>
            <!-- ช่องกำหนดรหัสใบ เพื่อความสบายใจ -->
            <div id="card-seeds-container" class="space-y-2 bg-slate-900/50 p-3 rounded-xl border border-slate-700/60">
                <label class="block text-xs font-semibold text-indigo-300">รหัสใบ Bingo (เว้นว่างเพื่อสุ่มออโต้):</label>
                <div id="seed-inputs-list" class="space-y-2"></div>
            </div>
            <button onclick="joinGame()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition cursor-pointer">เข้าสู่สนามแข่ง</button>
        </div>
    </div>

    <!-- HOST CONTROL PANEL (แสดงเมื่อเป็น Host) -->
    <div id="host-panel" class="hidden w-full max-w-4xl glass-panel p-6 rounded-3xl mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-indigo-400">🎮 แผงควบคุมเจ้ามือ (Host Control)</h2>
            <div class="flex gap-2">
                <button onclick="addAiBot()" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-xs font-semibold rounded-xl transition cursor-pointer">🤖 เพิ่ม AI Bot</button>
                <button onclick="resetGame()" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-500 text-xs font-semibold rounded-xl transition cursor-pointer">🔄 รีเซ็ตเกมใหม่</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div class="text-center bg-slate-900/70 p-4 rounded-2xl border border-slate-700/60">
                <p class="text-indigo-300 text-xs mb-1">เลขล่าสุด</p>
                <div id="current-called-number" class="text-6xl font-black text-indigo-400 glow-text">-</div>
            </div>
            <div class="md:col-span-2">
                <button onclick="drawNumber()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-lg font-bold rounded-2xl shadow-lg shadow-emerald-500/25 transition cursor-pointer mb-2">🎲 สุ่มหมายเลขถัดไป</button>
                <div class="flex justify-between text-xs text-slate-400 px-1">
                    <span>ออกแล้ว: <span id="called-count">0</span> / 75 ตัวเลข</span>
                    <span id="game-status-text" class="text-emerald-400 font-semibold">สถานะ: รอเริ่มเกม</span>
                </div>
            </div>
        </div>
        <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <p class="text-xs font-semibold mb-1 text-slate-300">ประวัติเลขที่ออก:</p>
                <div id="called-history" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-2.5 bg-slate-900/80 rounded-xl border border-slate-700 text-xs"></div>
            </div>
            <div>
                <p class="text-xs font-semibold mb-1 text-slate-300">ผู้เล่นในห้อง:</p>
                <div id="players-list" class="flex flex-col gap-1 max-h-24 overflow-y-auto p-2.5 bg-slate-900/80 rounded-xl border border-slate-700 text-xs"></div>
            </div>
        </div>
    </div>

    <!-- PLAYER GAME SCREEN (แสดงกระดานบิงโกของผู้เล่น หรือ Host ที่เลือกเล่นด้วย) -->
    <div id="player-screen" class="hidden w-full max-w-6xl mx-auto p-2">
        <div class="flex flex-col md:flex-row justify-between items-center glass-panel p-4 rounded-2xl mb-6 gap-4">
            <div>
                <h2 class="text-xl font-bold text-indigo-400" id="display-player-name">ผู้เล่น: -</h2>
                <p class="text-sm text-slate-400">ลุ้นหมายเลขและตรวจเช็กตารางอัตโนมัติแบบเรียลไทม์</p>
            </div>
            <div class="bg-slate-900/90 px-6 py-3 rounded-xl border border-slate-700 text-center shadow-inner">
                <span class="text-xs text-slate-400 block">เลขล่าสุดจากเจ้ามือ</span>
                <span id="player-latest-number" class="text-3xl font-black text-emerald-400">-</span>
            </div>
        </div>

        <!-- Cards Container -->
        <div id="boards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center"></div>
    </div>

    <!-- WINNER MODAL -->
    <div id="winner-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center shadow-2xl border border-indigo-500/30">
            <div class="text-6xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-4xl font-extrabold text-yellow-400 mb-2 glow-text">BINGO!</h2>
            <p class="text-lg text-slate-200 mb-6 font-medium" id="winner-announcement">ผู้ชนะคือ...</p>
            <button onclick="location.reload()" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl w-full shadow-lg transition cursor-pointer">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <!-- Firebase & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWlClrZ8-yKvt8ndVslCf7Z-xk4x2FENM",
            authDomain: "ubonpan-bingo.firebaseapp.com",
            databaseURL: "https://ubonpan-bingo-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ubonpan-bingo",
            storageBucket: "ubonpan-bingo.firebasestorage.app",
            messagingSenderId: "816601813982",
            appId: "1:816601813982:web:8b6bac227376ac9ead834f",
            measurementId: "G-5THKTN965F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.get = get;
        window.update = update;
        window.onValue = onValue;
    </script>

    <script>
        let playerName = "";
        let role = "player";
        let cardCount = 1;
        let playerBoards = [];
        let calledNumbersList = [];

        // Audio Management
        const bgm = document.getElementById('bgm');
        const sfxDraw = document.getElementById('sfx-draw');
        bgm.volume = 0.4;
        sfxDraw.volume = 0.5;

        function changeVolume(val) {
            bgm.volume = val;
            sfxDraw.volume = val;
        }

        function playDrawSound() {
            sfxDraw.currentTime = 0;
            sfxDraw.play().catch(e => {});
        }

        function toggleRoleOptions() {
            let roleVal = document.getElementById("role-select").value;
            let cardContainer = document.getElementById("card-count-container");
            let seedContainer = document.getElementById("card-seeds-container");
            
            if(roleVal === "host_only") {
                cardContainer.style.display = "none";
                seedContainer.style.display = "none";
            } else {
                cardContainer.style.display = "block";
                seedContainer.style.display = "block";
                renderCardSeedInputs();
            }
        }

        function renderCardSeedInputs() {
            let count = parseInt(document.getElementById("card-count").value);
            let container = document.getElementById("seed-inputs-list");
            container.innerHTML = "";
            for(let i=0; i<count; i++) {
                container.innerHTML += `
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400 w-16">ใบที่ ${i+1}:</span>
                        <input type="text" id="seed-${i}" placeholder="รหัสใบ (เช่น 777, luckynum)" class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                `;
            }
        }

        // Seedy Random generator to ensure custom card number always generates identical unique card
        function seededRandom(seedStr) {
            let hash = 0;
            for (let i = 0; i < seedStr.length; i++) {
                hash = (hash << 5) - hash + seedStr.charCodeAt(i);
                hash |= 0;
            }
            let x = Math.sin(hash++) * 10000;
            return x - Math.floor(x);
        }

        function generateColWithSeed(min, max, count, seedBase) {
            let nums = [];
            let attempt = 0;
            while(nums.length < count) {
                let seedStr = seedBase + "-" + attempt++;
                let rnd = seededRandom(seedStr);
                let n = Math.floor(rnd * (max - min + 1)) + min;
                if(!nums.includes(n)) nums.push(n);
            }
            return nums;
        }

        function generateBingoCard(customSeed) {
            let base = customSeed || Math.random().toString();
            const cols = [
                generateColWithSeed(1, 15, 5, base + "-B"),   
                generateColWithSeed(16, 30, 5, base + "-I"),  
                generateColWithSeed(31, 45, 4, base + "-N"), 
                generateColWithSeed(46, 60, 5, base + "-G"),  
                generateColWithSeed(61, 75, 5, base + "-O")   
            ];

            let board = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    if (c === 2 && r === 2) {
                        row.push({ number: "FREE", marked: true });
                    } else {
                        let colIdx = c;
                        let numIdx = r > 2 && c === 2 ? r - 1 : r;
                        row.push({ number: cols[colIdx][numIdx], marked: false });
                    }
                }
                board.push(row);
            }
            return board;
        }

        function joinGame() {
            let nameInput = document.getElementById("player-name").value.trim();
            if(!nameInput) {
                alert("กรุณากรอกชื่อก่อนเข้าเกมครับ!");
                return;
            }
            playerName = nameInput;
            role = document.getElementById("role-select").value;
            cardCount = parseInt(document.getElementById("card-count").value);

            bgm.play().catch(e => {});
            document.getElementById("lobby-screen").classList.add("hidden");

            // Handle UI layout based on role
            if(role === "host_only") {
                document.getElementById("host-panel").classList.remove("hidden");
                initHostListeners();
            } else if(role === "host_player") {
                document.getElementById("host-panel").classList.remove("hidden");
                document.getElementById("player-screen").classList.remove("hidden");
                document.getElementById("display-player-name").innerText = `เจ้ามือผู้ร่วมเล่น: ${playerName}`;
                
                playerBoards = [];
                for(let i=0; i<cardCount; i++) {
                    let seedInput = document.getElementById(`seed-${i}`)?.value.trim();
                    let cardSeed = seedInput ? `${playerName}-${seedInput}` : null;
                    playerBoards.push(generateBingoCard(cardSeed));
                }
                renderPlayerBoards();
                initHostListeners();
                initPlayerListeners();
            } else {
                // Regular player
                document.getElementById("player-screen").classList.remove("hidden");
                document.getElementById("display-player-name").innerText = `ผู้เล่น: ${playerName}`;
                
                playerBoards = [];
                for(let i=0; i<cardCount; i++) {
                    let seedInput = document.getElementById(`seed-${i}`)?.value.trim();
                    let cardSeed = seedInput ? `${playerName}-${seedInput}` : null;
                    playerBoards.push(generateBingoCard(cardSeed));
                }
                renderPlayerBoards();
                initPlayerListeners();
            }
        }

        function renderPlayerBoards() {
            let container = document.getElementById("boards-container");
            container.innerHTML = "";

            playerBoards.forEach((board, boardIndex) => {
                let cardHtml = `
                    <div class="glass-panel p-5 rounded-3xl w-full max-w-sm">
                        <h3 class="text-center font-bold text-indigo-400 mb-4 text-lg">🎯 ใบ Bingo ที่ ${boardIndex + 1}</h3>
                        <div class="grid grid-cols-5 gap-2 text-center font-semibold">
                            <div class="bg-indigo-900/70 py-2 rounded-xl text-xs font-bold text-indigo-300">B</div>
                            <div class="bg-indigo-900/70 py-2 rounded-xl text-xs font-bold text-indigo-300">I</div>
                            <div class="bg-indigo-900/70 py-2 rounded-xl text-xs font-bold text-indigo-300">N</div>
                            <div class="bg-indigo-900/70 py-2 rounded-xl text-xs font-bold text-indigo-300">G</div>
                            <div class="bg-indigo-900/70 py-2 rounded-xl text-xs font-bold text-indigo-300">O</div>
                `;

                for(let r=0; r<5; r++) {
                    for(let c=0; c<5; c++) {
                        let cell = board[r][c];
                        let bgClass = cell.marked 
                            ? "bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-lg shadow-emerald-500/30 scale-95 font-bold" 
                            : "bg-slate-900/90 text-slate-200 border border-slate-800";
                        cardHtml += `<div class="h-13 flex items-center justify-center rounded-xl text-sm sm:text-base transition-all duration-200 ${bgClass}">${cell.number}</div>`;
                    }
                }
                cardHtml += `</div></div>`;
                container.innerHTML += cardHtml;
            });
        }

        let aiBots = [];

        function initHostListeners() {
            window.onValue(window.ref(window.db, 'bingoGame'), (snapshot) => {
                let data = snapshot.val();
                if(data) {
                    calledNumbersList = data.calledNumbers || [];
                    document.getElementById("current-called-number").innerText = data.lastCalled || "-";
                    document.getElementById("called-count").innerText = calledNumbersList.length;
                    
                    let historyHtml = calledNumbersList.map(n => `<span class="px-2.5 py-1 bg-slate-800 rounded-lg border border-slate-700">${n}</span>`).join('');
                    document.getElementById("called-history").innerHTML = historyHtml;

                    let players = data.players || {};
                    let playersHtml = Object.keys(players).map(p => `<div class="px-3 py-1 bg-slate-800 rounded-xl border border-slate-700 flex justify-between"><span>👤 ${p}</span><span class="text-indigo-400">${players[p].status}</span></div>`).join('');
                    document.getElementById("players-list").innerHTML = playersHtml || '<span class="text-slate-500">ยังไม่มีผู้เล่นในระบบ</span>';

                    if(data.winner) {
                        document.getElementById("winner-announcement").innerText = `ผู้เล่น "${data.winner}" ทำการ BINGO สำเร็จแล้ว!`;
                        document.getElementById("winner-modal").classList.remove("hidden");
                    }
                }
            });
        }

        function drawNumber() {
            if(calledNumbersList.length >= 75) {
                alert("ออกครบทุกหมายเลขแล้ว!");
                return;
            }
            let num;
            do {
                num = Math.floor(Math.random() * 75) + 1;
            } while(calledNumbersList.includes(num));

            calledNumbersList.push(num);
            playDrawSound();

            aiBots.forEach(bot => {
                checkBotWin(bot, num);
            });

            window.update(window.ref(window.db, 'bingoGame'), {
                calledNumbers: calledNumbersList,
                lastCalled: num
            });
        }

        function addAiBot() {
            let botName = `🤖 Bot-${aiBots.length + 1}`;
            let botBoard = generateBingoCard(botName);
            aiBots.push({ name: botName, board: botBoard });

            window.get(window.ref(window.db, 'bingoGame/players')).then((snapshot) => {
                let players = snapshot.val() || {};
                players[botName] = { status: "กำลังเล่น (Bot)" };
                window.update(window.ref(window.db, 'bingoGame'), { players: players });
            });
            alert(`เพิ่ม ${botName} เข้ามาแข่งขันเรียบร้อย!`);
        }

        function checkBotWin(bot, newNum) {
            let isBingo = false;
            bot.board.forEach(row => {
                row.forEach(cell => {
                    if(cell.number === newNum) cell.marked = true;
                });
            });

            let b = bot.board;
            for(let r=0; r<5; r++) if(b[r].every(c => c.marked)) isBingo = true;
            for(let c=0; c<5; c++) if(b.every(row => row[c].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => b[i][i].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => b[i][4-i].marked)) isBingo = true;

            if(isBingo) {
                window.update(window.ref(window.db, 'bingoGame'), { winner: bot.name });
            }
        }

        function resetGame() {
            aiBots = [];
            window.set(window.ref(window.db, 'bingoGame'), {
                calledNumbers: [],
                lastCalled: null,
                winner: null,
                players: {}
            });
            alert("รีเซ็ตเกมเรียบร้อยแล้ว!");
        }

        function initPlayerListeners() {
            window.onValue(window.ref(window.db, 'bingoGame'), (snapshot) => {
                let data = snapshot.val();
                if(!data) return;

                calledNumbersList = data.calledNumbers || [];
                let lastCalled = data.lastCalled || "-";
                document.getElementById("player-latest-number").innerText = lastCalled;

                if(data.winner) {
                    document.getElementById("winner-announcement").innerText = `ผู้เล่น "${data.winner}" ทำการ BINGO สำเร็จแล้ว!`;
                    document.getElementById("winner-modal").classList.remove("hidden");
                    return;
                }

                playerBoards.forEach((board, bIdx) => {
                    let hasChanged = false;
                    for(let r=0; r<5; r++) {
                        for(let c=0; c<5; c++) {
                            if(board[r][c].number !== "FREE" && calledNumbersList.includes(board[r][c].number)) {
                                if(!board[r][c].marked) {
                                    board[r][c].marked = true;
                                    hasChanged = true;
                                }
                            }
                        }
                    }
                    if(hasChanged) {
                        renderPlayerBoards();
                        checkWinCondition(bIdx);
                    }
                });
            });

            window.get(window.ref(window.db, 'bingoGame/players')).then((snapshot) => {
                let players = snapshot.val() || {};
                players[playerName] = { status: "กำลังเล่น" };
                window.update(window.ref(window.db, 'bingoGame'), { players: players });
            });
        }

        function checkWinCondition(boardIndex) {
            let board = playerBoards[boardIndex];
            let isBingo = false;

            for(let r=0; r<5; r++) if(board[r].every(cell => cell.marked)) isBingo = true;
            for(let c=0; c<5; c++) if(board.every(row => row[c].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => board[i][i].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => board[i][4-i].marked)) isBingo = true;

            if(isBingo) {
                window.update(window.ref(window.db, 'bingoGame'), { winner: playerName });
            }
        }

        // Initialize seed inputs on load
        window.onload = () => {
            renderCardSeedInputs();
        };
    </script>
</body>
</html>
