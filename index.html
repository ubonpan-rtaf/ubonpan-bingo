<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubonpan Multiplayer Bingo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="glass-panel p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-extrabold text-center mb-6 text-indigo-400 glow-text">🎯 UBONPAN BINGO</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">ชื่อผู้เล่น / ผู้คุมเกม:</label>
                <input type="text" id="player-name" placeholder="กรอกชื่อของคุณ..." class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">เลือกบทบาท:</label>
                <select id="role-select" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition" onchange="toggleCardOptions()">
                    <option value="player">ผู้เล่น (Player)</option>
                    <option value="host">ผู้คุมเกม (Host - สุ่มเลข & จัดการบอท)</option>
                </select>
            </div>
            <div id="card-count-container">
                <label class="block text-sm font-medium mb-1 text-slate-300">จำนวนใบ Bingo (1-3 ใบ):</label>
                <select id="card-count" class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white transition">
                    <option value="1">1 ใบ (ใหญ่ชัดเจน)</option>
                    <option value="2">2 ใบ (กำลังดี)</option>
                    <option value="3">3 ใบ (ท้าทายสายตา)</option>
                </select>
            </div>
            <button onclick="joinGame()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition duration-200">เข้าสู่เกม</button>
        </div>
    </div>

    <!-- HOST SCREEN -->
    <div id="host-screen" class="hidden w-full max-w-3xl glass-panel p-6 rounded-3xl shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-indigo-400">🎮 แผงควบคุม Host</h2>
            <div class="flex gap-2">
                <button onclick="addAiBot()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-sm font-semibold rounded-xl shadow-md transition">🤖 เพิ่มบอท AI เล่นด้วย</button>
                <button onclick="resetGame()" class="px-4 py-2 bg-red-600/80 hover:bg-red-500 text-sm font-semibold rounded-xl transition">รีเซ็ตเกมใหม่</button>
            </div>
        </div>
        <div class="text-center bg-slate-900/60 p-8 rounded-2xl border border-slate-700/60 mb-6 shadow-inner">
            <p class="text-indigo-300 text-sm mb-2 font-medium">หมายเลขล่าสุดที่ออก</p>
            <div id="current-called-number" class="text-8xl font-black text-indigo-400 glow-text">-</div>
        </div>
        <button onclick="drawNumber()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-xl font-bold rounded-2xl shadow-lg shadow-emerald-500/25 transition duration-200 mb-6">🎲 สุ่มหมายเลขถัดไป</button>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <p class="text-sm font-semibold mb-2 text-slate-300">ประวัติหมายเลข (<span id="called-count">0</span>/75):</p>
                <div id="called-history" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-3 bg-slate-900/80 rounded-xl border border-slate-700 text-sm"></div>
            </div>
            <div>
                <p class="text-sm font-semibold mb-2 text-slate-300">ผู้เล่นในห้อง (รวมบอท):</p>
                <div id="players-list" class="flex flex-col gap-2 max-h-36 overflow-y-auto p-3 bg-slate-900/80 rounded-xl border border-slate-700 text-sm"></div>
            </div>
        </div>
    </div>

    <!-- PLAYER SCREEN -->
    <div id="player-screen" class="hidden w-full max-w-6xl mx-auto p-2">
        <div class="flex flex-col md:flex-row justify-between items-center glass-panel p-4 rounded-2xl mb-6 gap-4">
            <div>
                <h2 class="text-xl font-bold text-indigo-400" id="display-player-name">ผู้เล่น: -</h2>
                <p class="text-sm text-slate-400">สถานะ: กำลังลุ้นตัวเลขจาก Host...</p>
            </div>
            <div class="bg-slate-900/80 px-6 py-3 rounded-xl border border-slate-700 text-center shadow-inner">
                <span class="text-xs text-slate-400 block">เลขล่าสุดที่ออก</span>
                <span id="player-latest-number" class="text-3xl font-black text-emerald-400">-</span>
            </div>
        </div>

        <!-- Cards Container (Responsive Grid for 1-3 cards) -->
        <div id="boards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center"></div>
    </div>

    <!-- WINNER MODAL -->
    <div id="winner-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center shadow-2xl border border-indigo-500/30 animate-pulse">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-4xl font-extrabold text-yellow-400 mb-2 glow-text">BINGO!</h2>
            <p class="text-lg text-slate-200 mb-6 font-medium" id="winner-announcement">ผู้ชนะคือ...</p>
            <button onclick="location.reload()" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl w-full shadow-lg transition">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWlClrZ8-yKvt8ndVslCf7Z-xk4x2FENM",
            authDomain: "ubonpan-bingo.firebaseapp.com",
            databaseURL: "https://ubonpan-bingo-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ubonpan-bingo",
            storageBucket: "ubonpan-bingo.firebasestorage.app",
            messagingSenderId: "816601813982",
            appId: "1:816601813982:web:8b6bac227376ac9ead834f",
            measurementId: "G-5THKTN965F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.get = get;
        window.update = update;
        window.onValue = onValue;
    </script>

    <!-- Game & Bot Logic Script -->
    <script>
        let playerName = "";
        let role = "player";
        let cardCount = 1;
        let playerBoards = [];
        let calledNumbersList = [];

        function toggleCardOptions() {
            const roleSelect = document.getElementById("role-select").value;
            document.getElementById("card-count-container").style.display = roleSelect === "host" ? "none" : "block";
        }

        function generateBingoCard() {
            const cols = [
                generateCol(1, 15, 5),   
                generateCol(16, 30, 5),  
                generateCol(31, 45, 4, true), 
                generateCol(46, 60, 5),  
                generateCol(61, 75, 5)   
            ];

            let board = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    if (c === 2 && r === 2) {
                        row.push({ number: "FREE", marked: true });
                    } else {
                        let colIdx = c;
                        let numIdx = r > 2 && c === 2 ? r - 1 : r;
                        row.push({ number: cols[colIdx][numIdx], marked: false });
                    }
                }
                board.push(row);
            }
            return board;
        }

        function generateCol(min, max, count) {
            let nums = [];
            while(nums.length < count) {
                let n = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!nums.includes(n)) nums.push(n);
            }
            return nums;
        }

        function joinGame() {
            const nameInput = document.getElementById("player-name").value.trim();
            if(!nameInput) {
                alert("กรุณากรอกชื่อก่อนเข้าเกม!");
                return;
            }
            playerName = nameInput;
            role = document.getElementById("role-select").value;
            cardCount = parseInt(document.getElementById("card-count").value);

            document.getElementById("lobby-screen").classList.add("hidden");

            if(role === "host") {
                document.getElementById("host-screen").classList.remove("hidden");
                initHostListeners();
            } else {
                document.getElementById("player-screen").classList.remove("hidden");
                document.getElementById("display-player-name").innerText = `ผู้เล่น: ${playerName}`;
                
                playerBoards = [];
                for(let i=0; i<cardCount; i++) {
                    playerBoards.push(generateBingoCard());
                }
                renderPlayerBoards();
                initPlayerListeners();
            }
        }

        function renderPlayerBoards() {
            const container = document.getElementById("boards-container");
            container.innerHTML = "";

            playerBoards.forEach((board, boardIndex) => {
                let cardHtml = `
                    <div class="glass-panel p-5 rounded-3xl shadow-xl w-full max-w-sm border border-slate-700/80">
                        <h3 class="text-center font-bold text-indigo-400 mb-4 text-lg">🎯 ใบ Bingo ที่ ${boardIndex + 1}</h3>
                        <div class="grid grid-cols-5 gap-2 text-center font-semibold">
                            <div class="bg-indigo-900/60 py-2 rounded-xl text-xs font-bold text-indigo-300">B</div>
                            <div class="bg-indigo-900/60 py-2 rounded-xl text-xs font-bold text-indigo-300">I</div>
                            <div class="bg-indigo-900/60 py-2 rounded-xl text-xs font-bold text-indigo-300">N</div>
                            <div class="bg-indigo-900/60 py-2 rounded-xl text-xs font-bold text-indigo-300">G</div>
                            <div class="bg-indigo-900/60 py-2 rounded-xl text-xs font-bold text-indigo-300">O</div>
                `;

                for(let r=0; r<5; r++) {
                    for(let c=0; c<5; c++) {
                        let cell = board[r][c];
                        let bgClass = cell.marked 
                            ? "bg-gradient-to-br from-emerald-500 to-teal-600 text-white shadow-lg shadow-emerald-500/30 scale-95 font-bold" 
                            : "bg-slate-900/80 text-slate-200 hover:bg-slate-800 border border-slate-800";
                        cardHtml += `<div class="h-13 flex items-center justify-center rounded-xl text-sm sm:text-base transition-all duration-200 ${bgClass}">${cell.number}</div>`;
                    }
                }
                cardHtml += `</div></div>`;
                container.innerHTML += cardHtml;
            });
        }

        // --- Host & Bot Logic ---
        let aiBots = [];

        function initHostListeners() {
            window.onValue(window.ref(window.db, 'bingoGame'), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    calledNumbersList = data.calledNumbers || [];
                    document.getElementById("current-called-number").innerText = data.lastCalled || "-";
                    document.getElementById("called-count").innerText = calledNumbersList.length;
                    
                    let historyHtml = calledNumbersList.map(n => `<span class="px-2.5 py-1 bg-slate-800 rounded-lg border border-slate-700">${n}</span>`).join('');
                    document.getElementById("called-history").innerHTML = historyHtml;

                    let players = data.players || {};
                    let playersHtml = Object.keys(players).map(p => `<div class="px-3 py-1.5 bg-slate-800 rounded-xl border border-slate-700 flex justify-between"><span>👤 ${p}</span><span class="text-indigo-400">${players[p].status}</span></div>`).join('');
                    document.getElementById("players-list").innerHTML = playersHtml || '<span class="text-slate-500">ยังไม่มีผู้เล่นในระบบ</span>';

                    if(data.winner) {
                        document.getElementById("winner-announcement").innerText = `ผู้เล่น "${data.winner}" ทำการ BINGO สำเร็จแล้ว!`;
                        document.getElementById("winner-modal").classList.remove("hidden");
                    }
                }
            });
        }

        function drawNumber() {
            if(calledNumbersList.length >= 75) {
                alert("ออกครบทุกหมายเลขแล้ว!");
                return;
            }
            let num;
            do {
                num = Math.floor(Math.random() * 75) + 1;
            } while(calledNumbersList.includes(num));

            calledNumbersList.push(num);

            // จำลองการเล่นของบอท AI ทุกครั้งที่กดสุ่มเลข
            aiBots.forEach(bot => {
                checkBotWin(bot, num);
            });

            window.update(window.ref(window.db, 'bingoGame'), {
                calledNumbers: calledNumbersList,
                lastCalled: num
            });
        }

        function addAiBot() {
            let botName = `🤖 Bot-${aiBots.length + 1}`;
            let botBoard = generateBingoCard();
            aiBots.push({ name: botName, board: botBoard });

            // อัปเดตรายชื่อผู้เล่นใน Firebase
            window.get(window.ref(window.db, 'bingoGame/players')).then((snapshot) => {
                let players = snapshot.val() || {};
                players[botName] = { status: "กำลังเล่น" };
                window.update(window.ref(window.db, 'bingoGame'), { players: players });
            });
            alert(`เพิ่ม ${botName} เข้าสู่สนามแข่งแล้ว!`);
        }

        function checkBotWin(bot, newNum) {
            let isBingo = false;
            bot.board.forEach(row => {
                row.forEach(cell => {
                    if(cell.number === newNum) cell.marked = true;
                });
            });

            // เช็คชนะของบอท
            let b = bot.board;
            for(let r=0; r<5; r++) if(b[r].every(c => c.marked)) isBingo = true;
            for(let c=0; c<5; c++) if(b.every(r => r[c].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => b[i][i].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => b[i][4-i].marked)) isBingo = true;

            if(isBingo) {
                window.update(window.ref(window.db, 'bingoGame'), { winner: bot.name });
            }
        }

        function resetGame() {
            aiBots = [];
            window.set(window.ref(window.db, 'bingoGame'), {
                calledNumbers: [],
                lastCalled: null,
                winner: null,
                players: {}
            });
            alert("รีเซ็ตเกมเรียบร้อย!");
        }

        // --- Player Listeners ---
        function initPlayerListeners() {
            window.onValue(window.ref(window.db, 'bingoGame'), (snapshot) => {
                const data = snapshot.val();
                if(!data) return;

                calledNumbersList = data.calledNumbers || [];
                let lastCalled = data.lastCalled || "-";
                document.getElementById("player-latest-number").innerText = lastCalled;

                if(data.winner) {
                    document.getElementById("winner-announcement").innerText = `ผู้เล่น "${data.winner}" ทำการ BINGO สำเร็จแล้ว!`;
                    document.getElementById("winner-modal").classList.remove("hidden");
                    return;
                }

                playerBoards.forEach((board, bIdx) => {
                    let hasChanged = false;
                    for(let r=0; r<5; r++) {
                        for(let c=0; c<5; c++) {
                            if(board[r][c].number !== "FREE" && calledNumbersList.includes(board[r][c].number)) {
                                if(!board[r][c].marked) {
                                    board[r][c].marked = true;
                                    hasChanged = true;
                                }
                            }
                        }
                    }
                    if(hasChanged) {
                        renderPlayerBoards();
                        checkWinCondition(bIdx);
                    }
                });
            });

            // ลงทะเบียนชื่อผู้เล่นตัวเองใน Firebase
            window.get(window.ref(window.db, 'bingoGame/players')).then((snapshot) => {
                let players = snapshot.val() || {};
                players[playerName] = { status: "กำลังเล่น" };
                window.update(window.ref(window.db, 'bingoGame'), { players: players });
            });
        }

        function checkWinCondition(boardIndex) {
            let board = playerBoards[boardIndex];
            let isBingo = false;

            for(let r=0; r<5; r++) if(board[r].every(cell => cell.marked)) isBingo = true;
            for(let c=0; c<5; c++) if(board.every(row => row[c].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => board[i][i].marked)) isBingo = true;
            if([0,1,2,3,4].every(i => board[i][4-i].marked)) isBingo = true;

            if(isBingo) {
                window.update(window.ref(window.db, 'bingoGame'), { winner: playerName });
            }
        }
    </script>
</body>
</html>
